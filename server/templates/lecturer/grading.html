{% extends "base.html" %}

{% block title %}Grade Submission - Assessment System{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="/lecturer/dashboard" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
    </a>
</div>

<div id="gradingHeader" class="mb-4">
    <div class="spinner-border" role="status"></div>
</div>

<div id="gradingContent"></div>

<div class="mt-4" id="gradingActions" style="display: none;">
    <button class="btn btn-success btn-lg" onclick="GradingPage.finalize()">
        <i class="fas fa-check me-2"></i>Finalize Grading
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script>
const SUBMISSION_ID = {{ submission_id|tojson }};

const GradingPage = {
    submission: null,

    async api(method, endpoint, data) {
        const opts = { method, credentials: 'include', headers: {} };
        if (data) {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(data);
        }
        const res = await fetch(endpoint, opts);
        const json = res.headers.get('content-type')?.includes('json') ? await res.json() : null;
        if (!res.ok) throw new Error(json?.error || `Request failed (${res.status})`);
        return json;
    },

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
    },

    parseTextAnswerParts(answerText, types) {
        const result = { multiple_choice: '', text: '' };
        if (!answerText) return result;
        if (types.includes('multiple_choice') && types.includes('text')) {
            try {
                const parsed = JSON.parse(answerText);
                result.multiple_choice = parsed.multiple_choice || '';
                result.text = parsed.text || '';
                return result;
            } catch {
                result.text = answerText;
                return result;
            }
        }
        if (types.includes('multiple_choice')) result.multiple_choice = answerText;
        if (types.includes('text')) result.text = answerText;
        return result;
    },

    async init() {
        document.querySelector('.navbar a[href="/logout"]')?.setAttribute('href', '/lecturer/logout');
        try {
            const me = await this.api('GET', '/api/v1/auth/me');
            if (me.role !== 'lecturer') { window.location.href = '/lecturer/login'; return; }
            this.submission = await this.api('GET', `/api/v1/grading/submissions/${SUBMISSION_ID}`);
            this.render();
        } catch (e) {
            document.getElementById('gradingHeader').innerHTML = `<div class="alert alert-danger">${this.escapeHtml(e.message)}</div>`;
        }
    },

    render() {
        const s = this.submission;
        document.getElementById('gradingHeader').innerHTML = `
            <h2>Grade: ${this.escapeHtml(s.test_name)}</h2>
            <p class="text-muted">Student: ${this.escapeHtml(s.username)} ${s.student_id ? '(' + this.escapeHtml(s.student_id) + ')' : ''} &mdash; Status: <span class="badge bg-info">${this.escapeHtml(s.status)}</span></p>
        `;

        document.getElementById('gradingContent').innerHTML = s.questions.map((q, i) => {
            const ans = q.answer || {};
            const types = q.answer_types && q.answer_types.length ? q.answer_types : [q.type];
            const textParts = this.parseTextAnswerParts(ans.answer_text, types);
            const sections = [];

            if (types.includes('multiple_choice')) {
                sections.push(`<div class="mb-3"><h6>Multiple choice</h6><p>${this.escapeHtml(textParts.multiple_choice || '(no answer)')}</p></div>`);
            }
            if (types.includes('text')) {
                sections.push(`<div class="mb-3"><h6>Written answer</h6><p>${this.escapeHtml(textParts.text || '(no answer)')}</p></div>`);
            }
            if (types.includes('code')) {
                sections.push(`<div class="mb-3"><h6>Code</h6><pre class="bg-light p-3 rounded"><code>${this.escapeHtml(ans.code || '(no answer)')}</code></pre></div>`);
            }
            if (types.includes('diagram')) {
                sections.push(`<div class="mb-3"><h6>Diagram</h6>${
                    ans.diagram_data
                        ? `<img src="${ans.diagram_data}" class="img-fluid border rounded" style="max-height:300px">`
                        : '<p class="text-muted">(no diagram submitted)</p>'
                }</div>`);
            }

            const typeLabel = q.type_label || types.join(' + ');

            return `
                <div class="card mb-3" id="question-${q.question_id}">
                    <div class="card-header d-flex justify-content-between">
                        <span>Question ${i + 1} (${this.escapeHtml(typeLabel)}) &mdash; Max: ${q.points} pts</span>
                    </div>
                    <div class="card-body">
                        <p><strong>${this.escapeHtml(q.content)}</strong></p>
                        <h6>Student Answer:</h6>
                        ${sections.join('') || '<p class="text-muted">(no answer)</p>'}
                        <div class="row mt-3">
                            <div class="col-md-3">
                                <label class="form-label">Score (0 - ${q.points})</label>
                                <input type="number" class="form-control score-input" data-answer-id="${ans.id || ''}" data-max="${q.points}" value="${ans.score ?? ''}" min="0" max="${q.points}" step="0.1">
                            </div>
                            <div class="col-md-9">
                                <label class="form-label">Feedback</label>
                                <textarea class="form-control feedback-input" data-answer-id="${ans.id || ''}" rows="2">${this.escapeHtml(ans.feedback || '')}</textarea>
                            </div>
                        </div>
                        ${`<button class="btn btn-sm btn-primary mt-2" onclick="GradingPage.saveAnswer(${ans.id}, ${q.question_id})">Save</button>`}
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('gradingActions').style.display = 'block';
    },

    async saveAnswer(answerId, questionId) {
        const card = document.getElementById(`question-${questionId}`);
        const scoreInput = card.querySelector('.score-input');
        const scoreRaw = scoreInput.value.trim();
        const max = parseFloat(scoreInput.dataset.max);
        const feedback = card.querySelector('.feedback-input').value;

        let score = null;
        if (scoreRaw !== '') {
            score = parseFloat(scoreRaw);
            if (Number.isNaN(score)) {
                alert('Please enter a valid score.');
                return;
            }
            if (score < 0 || score > max) {
                alert(`Score must be between 0 and ${max}.`);
                return;
            }
        }

        try {
            await this.api('PUT', `/api/v1/grading/answers/${answerId}`, { score, feedback });
            alert('Answer saved.');
        } catch (e) {
            alert('Error: ' + e.message);
        }
    },

    async finalize() {
        const cards = document.querySelectorAll('[id^="question-"]');
        for (const card of cards) {
            const answerId = card.querySelector('.score-input')?.dataset.answerId;
            if (!answerId) continue;
            const scoreInput = card.querySelector('.score-input');
            const scoreRaw = scoreInput.value.trim();
            const max = parseFloat(scoreInput.dataset.max);
            const feedback = card.querySelector('.feedback-input').value;

            let score = 0;
            if (scoreRaw !== '') {
                score = parseFloat(scoreRaw);
                if (Number.isNaN(score) || score < 0 || score > max) {
                    alert(`Invalid score on one or more questions. Each score must be between 0 and its maximum.`);
                    return;
                }
            }

            await this.api('PUT', `/api/v1/grading/answers/${answerId}`, { score, feedback });
        }
        try {
            await this.api('POST', `/api/v1/grading/submissions/${SUBMISSION_ID}/finalize`);
            alert('Grading finalized!');
            window.location.href = '/lecturer/dashboard';
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }
};

GradingPage.init();
</script>
{% endblock %}
